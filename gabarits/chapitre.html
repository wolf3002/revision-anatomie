<div class="page">
  <a class="retour" href="index.html">&lsaquo; Accueil</a>
  <header class="entete">
    <span class="entete__num">{{num}}</span>
    <h1 class="entete__titre">{{titre}}</h1>
    <span class="entete__slides">{{slides}}</span>
  </header>
  <div class="onglets js-seulement" role="tablist" aria-label="Fiche ou exercices">
    {{onglets}}
  </div>

  <div class="panneaux">
    <section class="panneau" id="fiche" data-panneau="fiche" role="tabpanel" aria-labelledby="onglet-fiche">
      <div class="fiche">
        {{fiche}}
      </div>
      <p class="fiche-suite js-seulement">
        <a class="action action--majeure" href="#exercer" data-aller="exercer">S&#x27;exercer sur ce chapitre</a>
      </p>
    </section>
    <section class="panneau" id="exercer" data-panneau="exercer" role="tabpanel" aria-labelledby="onglet-exercer" hidden>
      {{seance}}
    </section>
  </div>

  <p class="sans-js">Les exercices demandent JavaScript. La fiche ci-dessus se lit telle quelle.</p>

  <div id="reservoir-exercices" data-reservoir hidden aria-hidden="true">{{reservoir}}</div>

  <div class="actions" id="actions-carte" hidden>
    <button type="button" class="action action--majeure" data-action="retourner">
      Retourner <span class="touche">Espace</span>
    </button>
    <button type="button" class="action" data-verdict="rate">Raté <span class="touche">1</span></button>
    <button type="button" class="action" data-verdict="difficile">Difficile <span class="touche">2</span></button>
    <button type="button" class="action" data-verdict="su">Su <span class="touche">3</span></button>
  </div>
</div>
